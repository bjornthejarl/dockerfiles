services:
  app:
    image: invoiceninja/invoiceninja-debian:latest
    restart: unless-stopped
    environment:
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - REQUIRE_HTTPS=${REQUIRE_HTTPS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - IN_USER_EMAIL=${IN_USER_EMAIL}
      - IN_PASSWORD=${IN_PASSWORD}
    volumes:
      - app_public_v3:/var/www/html/public
      - app_storage_v3:/var/www/html/storage
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - app_public_v2:/var/www/html/public:ro
      - app_storage_v2:/var/www/html/storage:ro
    depends_on:
      - app

  mysql:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data_v2:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data_v2:/data

volumes:
  app_public_v2:
    driver: local
  app_storage_v2:
    driver: local
  mysql_data_v2:
    driver: local
  redis_data_v2:
    driver: local
